name: CI and Release

on:
  pull_request:
    branches: [develop, main, master]
  push:
    branches: [develop, main, master]

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and validate mod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Gen1Recomp test harness
        run: git clone --depth 1 --branch dev https://github.com/bryanthaboi/gen1recomp.git gen1recomp

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run Emerald mod test
        run: luajit tests/exp_qol_test.lua

      - name: Strict modkit validation
        run: python3 gen1recomp/tools/modkit.py --repo gen1recomp validate "$GITHUB_WORKSPACE" --base fixture --strict

      - name: Modkit lint
        run: python3 gen1recomp/tools/modkit.py --repo gen1recomp lint "$GITHUB_WORKSPACE"

      - name: Verify installable package
        run: python3 gen1recomp/tools/modkit.py --repo gen1recomp pack "$GITHUB_WORKSPACE" --base fixture --output "$RUNNER_TEMP/exp_qol-ci.modpkg"

  release:
    name: Release merged pull request
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout mod history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Gen1Recomp packer
        run: git clone --depth 1 --branch dev https://github.com/bryanthaboi/gen1recomp.git gen1recomp

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Confirm push came from a merged PR
        id: merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.merged_at != null and (.base.ref == "main" or .base.ref == "master"))] | length')"
          if [ "$count" -gt 0 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No merged PR found for this push; skipping release."
          fi

      - name: Determine release version
        id: version
        if: steps.merged.outputs.release == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import subprocess
          import sys

          pattern = re.compile(r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$")

          def parse(value):
              match = pattern.fullmatch(value)
              return tuple(map(int, match.groups())) if match else None

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          with open("manifest.json", encoding="utf-8") as source:
              manifest_version = str(json.load(source).get("version", ""))
          current = parse(manifest_version)
          if current is None:
              fail(f"manifest version {manifest_version!r} is not X.Y.Z")

          tags = subprocess.check_output(
              ["git", "tag", "--list", "v*"], text=True
          ).splitlines()
          versions = [parse(tag[1:]) for tag in tags if tag.startswith("v")]
          released = max((version for version in versions if version), default=None)

          if released is None or current > released:
              version = current
          else:
              version = (released[0], released[1], released[2] + 1)

          text = ".".join(map(str, version))
          print(f"version={text}")
          print(f"tag=v{text}")
          PY

      - name: Refuse duplicate release
        if: steps.merged.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi

      - name: Build and validate release ZIP
        if: steps.merged.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_ID: exp_qol
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/$MOD_ID-$VERSION"
          output="$GITHUB_WORKSPACE/dist"
          mkdir -p "$staging" "$output"
          git archive "$GITHUB_SHA" | tar -x -C "$staging"

          python3 - "$staging/manifest.json" "$staging/CHANGELOG.md" "$VERSION" "$(date -u +%F)" <<'PY'
          import json
          import pathlib
          import re
          import sys

          manifest_path, changelog_path, version, release_date = sys.argv[1:]
          manifest_file = pathlib.Path(manifest_path)
          manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
          manifest["version"] = version
          manifest_file.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          changelog_file = pathlib.Path(changelog_path)
          changelog = changelog_file.read_text(encoding="utf-8")
          heading = re.compile(rf"(?m)^## \[{re.escape(version)}\](?:\s|$)")
          if not heading.search(changelog):
              marker = "# Changelog\n"
              if marker not in changelog:
                  raise SystemExit("CHANGELOG.md has no # Changelog heading")
              entry = (
                  f"## [{version}] - {release_date}\n\n"
                  "### Changed\n- Automated patch release.\n\n"
              )
              changelog = changelog.replace(marker, marker + "\n" + entry, 1)
              changelog_file.write_text(changelog, encoding="utf-8")
          PY

          package="$RUNNER_TEMP/$MOD_ID-$VERSION.modpkg"
          python3 gen1recomp/tools/modkit.py --repo gen1recomp pack "$staging" --base fixture --output "$package"
          cp "$package" "$output/$MOD_ID-$VERSION.zip"
          (cd "$output" && sha256sum "$MOD_ID-$VERSION.zip" > sha256sums.txt)

          unzip -Z1 "$output/$MOD_ID-$VERSION.zip" | grep -Fxq manifest.json
          if unzip -Z1 "$output/$MOD_ID-$VERSION.zip" | grep -q '^tests/'; then
            echo "::error::Test files must not be included in the release archive."
            exit 1
          fi
          unzip -p "$output/$MOD_ID-$VERSION.zip" manifest.json \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["version"] == sys.argv[1]' "$VERSION"

      - name: Publish GitHub Release and version tag
        if: steps.merged.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MOD_ID: exp_qol
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Install the ZIP in game via MODS > Import mod .zip. The manifest enables the game's Update and Versions controls." \
            "dist/$MOD_ID-$VERSION.zip" \
            dist/sha256sums.txt